communicator:
  verbose: False
debug:
  debug_mode: False
  validation_mode: False
encoder:
  precision_bits: 16
  truncation: "crypten"      # fixed-point rescaling (>> f) after every product: egk | crypten | fission
  lut_indexing: "crypten"    # LUT input -> bin index (>> j) before lookup: egk | crypten | fission | wave | wave_prob | sigma
functions:
  max:
    method: "log_reduction"
  exp:
    method: "poly"
    iterations: 8
    all_neg: False
  log:
    method: "iter"
    iterations: 2
    exp_iterations: 8
    order: 8
  reciprocal:
    method: "NR"
    nr_iters: 10
    log_iters: 1
    all_pos: True
    initial: null
  sqrt:
    method: "NR"
    nr_iters: 3
    nr_initial: null
  inv_sqrt:
    method: "NR"
    nr_iters: 3
    nr_initial: null
  sigmoid_tanh:
    method: "poly"
    terms: 32
  trigonometry:
    method: "NR"
    iterations: 10
  erf:
    method: "poly"
    iterations: 8
  gelu:
    method: "poly"
  silu:
    method: "poly"
  softmax:
    method: "approximation"
  log_softmax:
    method: "approximation"
  layernorm:
    method: "approximation"
mpc:
  active_security: False
  provider: "TFP"
  fss_prg: "splitmix64"   # PRG for DPF/DCF trees: splitmix64 (62-bit seeds, fast, NOT cryptographic) | chacha (128-bit seeds)
  fss_prg_rounds: 12       # ChaCha rounds when fss_prg == "chacha" (8 | 12 | 20)
  protocol: "beaver"
nn:
  dpsmpc:
    protocol: "layer_estimation"
    skip_loss_forward: True
    cache_pred_size: True
  gradients:
    layernorm: "normal"
