communicator:
  verbose: False
debug:
  debug_mode: False
  validation_mode: False
encoder:
  precision_bits: 16
  truncation: "egk"      # fixed-point rescaling (>> f) after every product: egk | crypten | fission
  lut_indexing: "sigma"   # LUT input -> bin index (>> j) before lookup: egk | crypten | fission | wave | wave_prob | sigma
functions:
  max:
    method: "tree"
  exp:
    method: "bior"
    iterations: 8
    haar_size_bits: 5
    bior_size_bits: 5
    lut_max_bits: 4
    all_neg: True
    neg_lut_size: 256 # 2^8
  log:
    method: "bior"
    iterations: 2
    exp_iterations: 8
    order: 8
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 6
  reciprocal:
    method: "bior"
    nr_iters: 10
    log_iters: 1
    all_pos: True
    initial: null
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 6
  sqrt:
    method: "bior"
    nr_iters: 3
    nr_initial: null
    haar_size_bits: 6
    bior_size_bits: 6
    lut_max_bits: 6
  inv_sqrt:
    method: "bior"
    haar_size_bits: 16
    bior_size_bits: 14   # 2^14 knots over [0, 2^8): spacing 1/64 (LayerNorm variance range; applied to L values per layer, so cheap)
    lut_max_bits: 8
    tailored_0_lut_max_bits: 0
    tailored_0_haar_size_bits: 12
    tailored_1_lut_max_bits: 8
    tailored_1_haar_size_bits: 8
  sigmoid_tanh:
    method: "bior"
    terms: 32
    haar_size_bits: 8
    bior_size_bits: 8
    sigmoid_lut_max_bits: 6
    tanh_lut_max_bits: 5
    sigmoid_fs_period: 16
    sigmoid_fs_terms: 8
    tanh_fs_period: 16
    tanh_fs_terms: 8
  trigonometry:
    method: "bior"
    iterations: 10
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 5
  erf:
    method: "bior"
    iterations: 8
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 5
    fs_period: 16
    fs_terms: 5
  gelu:
    method: "bior-lut-only"
    haar_size_bits: 5
    bior_size_bits: 5   # 32-knot bior(5,3): 4x lower interpolation error than 16 knots for ~+5% block time
    lut_max_bits: 3
    fs_period: 8
    fs_terms: 8
  silu:
    method: "bior-lut-only"
    haar_size_bits: 5
    bior_size_bits: 5   # 32-knot bior(5,3): 4x lower interpolation error than 16 knots for ~+5% block time
    lut_max_bits: 4
    fs_period: 16
    fs_terms: 12
  softmax:
    method: "approximation"
    ode_clip: True
    ode_iter_num: 16
    ode_ub: 12
    ode_lb: -4
  log_softmax:
    method: "approximation"
  layernorm:
    method: "approximation"
mpc:
  active_security: False
  provider: "TFP"
  protocol: "fss"
  fss_bits: 48   # effective bit-width for FSS comparisons (SIGMA Sec. 5.4.1): exact for |x| < 2^(fss_bits-2), i.e. |x| < 2^30 at f=16; -24% PRG calls vs. 64
nn:
  dpsmpc:
    protocol: "layer_estimation"
    skip_loss_forward: True
    cache_pred_size: True
  gradients:
    layernorm: "normal"
