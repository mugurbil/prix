[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prix-jax"
version = "0.2.1"
description = "PriX: A Modern, High-Performance JAX/XLA Alternative to CrypTen for Private Machine Learning & LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Mehmet Ugurbil", email = "mugurbil@gmail.com"}
]
keywords = [
    "mpc",
    "crypten",
    "privacy",
    "private-machine-learning",
    "secure-multiparty-computation",
    "secret-sharing",
    "jax",
    "xla",
    "transformers",
    "llm",
    "cryptography",
    "wavelets",
    "shaft",
    "curl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "PyWavelets>=1.4.1",
    "pyyaml>=6.0",
    "cloudpickle>=2.0",
]

[project.urls]
Homepage = "https://github.com/mugurbil/prix"
Documentation = "https://github.com/mugurbil/prix/tree/main/docs"
Repository = "https://github.com/mugurbil/prix"
Issues = "https://github.com/mugurbil/prix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prix*"]

[tool.setuptools.package-data]
"prix.config" = ["*.yaml"]
