[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prix"
version = "0.1.0"
description = "Private Machine Learning and LLM Inference via Secure Multi-Party Computation in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "jax>=0.5.1",
    "jaxlib>=0.5.1",
    "numpy>=1.26.4",
    "scipy>=1.10.0",
    "PyWavelets>=1.4.1",
    "pyyaml>=6.0",
    "omegaconf>=2.1.0",
    "pandas>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["prix*"]
