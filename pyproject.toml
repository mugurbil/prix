[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prix-jax"
version = "0.1.0"
description = "PriX: Private Accelerated Transformers via Secure Multi-Party Computation in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Mehmet Ugurbil", email = "mugurbil@gmail.com"}
]
keywords = ["mpc", "privacy", "jax", "transformers", "llm", "cryptography", "wavelets"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26.0",
    "scipy>=1.10.0",
    "PyWavelets>=1.4.1",
    "pyyaml>=6.0",
    "omegaconf>=2.1.0",
    "pandas>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/mugurbil/prix"
Repository = "https://github.com/mugurbil/prix"
Issues = "https://github.com/mugurbil/prix/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["prix*"]

[tool.setuptools.package-data]
"prix.config" = ["*.yaml"]
