communicator:
  verbose: False
debug:
  debug_mode: False
  validation_mode: False
encoder:
  precision_bits: 16
  truncation: "egk"      # fixed-point rescaling (>> f) after every product: egk | crypten | fission
  lut_indexing: "sigma"    # LUT input -> bin index (>> j) before lookup: egk | crypten | fission | wave | wave_prob | sigma
functions:
  max:
    method: "tree"
  exp:
    method: "split"
    iterations: 8
    haar_size_bits: 8
    bior_size_bits: 5
    lut_max_bits: 4
    all_neg: True
    neg_lut_size: 256 # 2^8
  log:
    method: "haar"
    iterations: 2
    exp_iterations: 8
    order: 8
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 6
  reciprocal:
    method: "haar"
    nr_iters: 10
    log_iters: 1
    all_pos: True
    initial: null
    haar_size_bits: 10
    bior_size_bits: 8
    lut_max_bits: 6
  sqrt:
    method: "haar"
    nr_iters: 3
    nr_initial: null
    haar_size_bits: 8
    bior_size_bits: 6
    lut_max_bits: 6
  inv_sqrt:
    method: "tailored_haar"
    haar_size_bits: 10
    bior_size_bits: 10
    lut_max_bits: 4
    tailored_0_lut_max_bits: 0
    tailored_0_haar_size_bits: 10
    tailored_1_lut_max_bits: 4
    tailored_1_haar_size_bits: 10
  sigmoid_tanh:
    method: "haar"
    terms: 32
    haar_size_bits: 8
    bior_size_bits: 8
    sigmoid_lut_max_bits: 6
    tanh_lut_max_bits: 5
    sigmoid_fs_period: 16
    sigmoid_fs_terms: 8
    tanh_fs_period: 16
    tanh_fs_terms: 8
  trigonometry:
    method: "haar"
    iterations: 10
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 5
  erf:
    method: "haar"
    iterations: 8
    haar_size_bits: 8
    bior_size_bits: 8
    lut_max_bits: 5
    fs_period: 16
    fs_terms: 5
  gelu:
    method: "haar"
    haar_size_bits: 8
    bior_size_bits: 4
    lut_max_bits: 2
    fs_period: 8
    fs_terms: 8
  silu:
    method: "haar"
    haar_size_bits: 10
    bior_size_bits: 4
    lut_max_bits: 3
    fs_period: 16
    fs_terms: 12
  softmax:
    method: "approximation"
    ode_clip: True
    ode_iter_num: 16
    ode_ub: 12
    ode_lb: -4
  log_softmax:
    method: "approximation"
  layernorm:
    method: "approximation"
mpc:
  active_security: False
  provider: "TFP"
  protocol: "fss"
  fss_bits: 64
nn:
  dpsmpc:
    protocol: "layer_estimation"
    skip_loss_forward: True
    cache_pred_size: True
  gradients:
    layernorm: "normal"
