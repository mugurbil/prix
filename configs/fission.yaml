communicator:
  verbose: False
debug:
  debug_mode: False
  validation_mode: False
encoder:
  precision_bits: 16
  truncation: "fission"      # fixed-point rescaling (>> f) after every product: egk | crypten | fission
  lut_indexing: "fission"    # LUT input -> bin index (>> j) before lookup: egk | crypten | fission | wave | wave_prob | sigma
functions:
  max:
    method: "log_reduction"
  exp:
    method: "fission"
  log:
    method: "fission"
  reciprocal:
    method: "fission"
  sqrt:
    method: "fission"
  inv_sqrt:
    method: "fission"
  sigmoid_tanh:
    method: "fission"
  trigonometry:
    method: "fission"
  erf:
    method: "fission"
  gelu:
    method: "fission"
  silu:
    method: "fission"
  softmax:
    method: "fission"
  log_softmax:
    method: "fission"
  layernorm:
    method: "fission"
mpc:
  active_security: False
  provider: "TFP"
  protocol: "beaver"
nn:
  dpsmpc:
    protocol: "layer_estimation"
    skip_loss_forward: True
    cache_pred_size: True
  gradients:
    layernorm: "fission"
